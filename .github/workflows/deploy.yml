name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "mongodb://localhost:27017/mini_erp"
      JWT_SECRET: "ci-secret-key-12345"
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install
        
    - name: Run Prisma Generate
      run: |
        cd backend
        npx prisma generate
        
    - name: Build Backend
      run: |
        cd backend
        npm run build

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps
        
    - name: Build Frontend
      run: |
        cd frontend
        npm run build
